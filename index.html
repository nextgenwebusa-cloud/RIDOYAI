<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ridoy AI - Custom Assistant</title>
    <style>
        :root {
            --accent-1: #00e5ff;
            --accent-2: #ff2e93;
            --accent-btn: linear-gradient(135deg, #0095ff, #7c4dff);
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            margin: 0;
            padding: 12px 10px calc(18px + env(safe-area-inset-bottom));
            background: radial-gradient(circle at 20% 20%, #141b33 0%, #090b12 65%, #05060a 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            height: 100dvh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            height: 100%;
            max-height: 820px;
            background: linear-gradient(180deg, rgba(20, 25, 42, 0.96) 0%, rgba(12, 15, 26, 0.98) 100%);
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.78), 0 0 0 1px rgba(255, 255, 255, 0.1);
            position: relative;
        }

        /* অটোমেটিক ব্যাকগ্রাউন্ড AI গ্রিড ও অরোরা */
        .ambient-bg {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .ambient-grid {
            position: absolute;
            inset: -40%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            transform: perspective(600px) rotateX(48deg);
            animation: gridDrift 14s linear infinite;
        }
        .orb-glow-1 {
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, color-mix(in srgb, var(--accent-1) 28%, transparent), transparent 70%);
            top: -40px;
            left: -40px;
            animation: orbMoveA 7s ease-in-out infinite;
        }
        .orb-glow-2 {
            position: absolute;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, color-mix(in srgb, var(--accent-2) 25%, transparent), transparent 70%);
            bottom: -50px;
            right: -40px;
            animation: orbMoveB 8.5s ease-in-out infinite;
        }

        @keyframes gridDrift {
            0% { transform: perspective(600px) rotateX(48deg) translateY(0); }
            100% { transform: perspective(600px) rotateX(48deg) translateY(32px); }
        }
        @keyframes orbMoveA {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(35px, 28px) scale(1.15); }
        }
        @keyframes orbMoveB {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-32px, -25px) scale(1.12); }
        }

        /* হেডার ও লোগো */
        .header {
            background: rgba(24, 30, 50, 0.92);
            backdrop-filter: blur(12px);
            padding: 11px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 10;
            gap: 8px;
        }
        .header-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .logo-box {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            border: 1px solid rgba(255, 255, 255, 0.35);
            flex-shrink: 0;
            box-shadow: 0 0 14px color-mix(in srgb, var(--accent-1) 35%, transparent);
            animation: miniLogoSpin3D 5.5s ease-in-out infinite;
        }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; }
        @keyframes miniLogoSpin3D {
            0%, 100% { transform: perspective(240px) rotateY(0deg) scale(1); }
            50% { transform: perspective(240px) rotateY(180deg) scale(1.06); }
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2ee59d;
            box-shadow: 0 0 8px #2ee59d;
            flex-shrink: 0;
        }
        .status-dot.offline {
            background: #ff5252;
            box-shadow: 0 0 8px #ff5252;
        }

        .dots-btn {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(45, 54, 82, 0.85);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* বাম ও ডান থ্রি-ডট ড্রপডাউন প্যানেল */
        .menu-backdrop {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 14;
        }
        .menu-backdrop.active { display: block; }

        .dot-dropdown {
            display: none;
            position: absolute;
            top: 56px;
            width: 278px;
            max-height: 75%;
            background: rgba(21, 27, 46, 0.98);
            backdrop-filter: blur(16px);
            border: 1px solid color-mix(in srgb, var(--accent-1) 28%, transparent);
            border-radius: 16px;
            padding: 12px;
            z-index: 15;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.72);
            flex-direction: column;
            gap: 9px;
            overflow-y: auto;
        }
        .dot-dropdown.left-menu { left: 10px; }
        .dot-dropdown.right-menu { right: 10px; }
        .dot-dropdown.active { display: flex; }

        .menu-gmail-box {
            background: rgba(12, 16, 28, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 11px;
            padding: 9px 11px;
        }
        .menu-gmail-label { font-size: 11px; color: var(--accent-1); font-weight: 700; }
        .menu-gmail-value { font-size: 13px; color: #ffffff; word-break: break-all; margin-top: 2px; }

        .new-chat-btn {
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-radius: 10px;
            background: var(--accent-btn);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        .saved-chats-title { font-size: 12px; color: #b8c2dc; font-weight: 700; margin-top: 2px; }
        .saved-chat-list { display: flex; flex-direction: column; gap: 6px; }
        .saved-chat-row {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .saved-chat-item {
            flex: 1;
            min-width: 0;
            background: rgba(34, 42, 68, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 10px;
            padding: 7px 9px;
            cursor: pointer;
            text-align: left;
            color: #eef2fc;
            font-size: 12px;
        }
        .saved-chat-item.active {
            border-color: var(--accent-1);
            background: rgba(0, 149, 255, 0.22);
        }
        .saved-chat-snippet { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
        .saved-chat-meta { font-size: 10px; color: #9aa6c7; margin-top: 2px; }
        .del-chat-btn {
            width: 30px;
            height: 36px;
            border-radius: 9px;
            border: 1px solid rgba(255, 110, 130, 0.3);
            background: rgba(110, 25, 40, 0.75);
            color: #ff99a8;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .voice-option-btn {
            width: 100%;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(32, 39, 62, 0.88);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .voice-option-btn.selected {
            border-color: var(--accent-2);
            background: linear-gradient(135deg, rgba(0, 149, 255, 0.24), rgba(255, 46, 147, 0.24));
            color: #8cf0ff;
        }

        .speed-row { display: flex; gap: 5px; }
        .speed-btn {
            flex: 1;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(30, 36, 56, 0.9);
            color: #cfd7ee;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .speed-btn.active {
            border-color: var(--accent-1);
            background: rgba(0, 229, 255, 0.2);
            color: #fff;
        }

        .theme-row { display: flex; gap: 6px; }
        .theme-chip {
            flex: 1;
            padding: 7px 6px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.16);
            background: rgba(28, 34, 52, 0.9);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }
        .theme-chip.active { border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.25); }

        .menu-action-row { display: flex; gap: 6px; }
        .menu-sec-btn {
            flex: 1;
            padding: 8px;
            border-radius: 9px;
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(42, 50, 78, 0.85);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .menu-sec-btn.danger { background: rgba(122, 28, 44, 0.88); border-color: rgba(255,110,130,0.35); }

        /* ভিউ কন্টেইনার */
        .screen { display: none; flex: 1; flex-direction: column; overflow: hidden; position: relative; z-index: 2; }
        .screen.active { display: flex; animation: screenFadeIn 0.45s ease; }
        @keyframes screenFadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.985); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* প্রিমিয়াম 3D AI লোগো ও অ্যানিমেশন স্টেজ */
        .ai-3d-stage {
            position: relative;
            width: 146px;
            height: 146px;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 750px;
        }
        .ai-halo {
            position: absolute;
            width: 126px;
            height: 126px;
            border-radius: 50%;
            background: radial-gradient(circle, color-mix(in srgb, var(--accent-1) 28%, transparent), color-mix(in srgb, var(--accent-2) 16%, transparent), transparent 72%);
            animation: haloPulse 2.8s ease-in-out infinite;
        }
        .ai-orbit-a {
            position: absolute;
            inset: 6px;
            border-radius: 46% 54% 51% 49% / 48% 45% 55% 52%;
            border: 2px solid transparent;
            border-top-color: var(--accent-1);
            border-right-color: #7c4dff;
            animation: orbit3DA 3.8s linear infinite;
            box-shadow: 0 0 16px color-mix(in srgb, var(--accent-1) 28%, transparent);
        }
        .ai-orbit-b {
            position: absolute;
            inset: 14px;
            border-radius: 52% 48% 46% 54% / 54% 50% 50% 46%;
            border: 2px solid transparent;
            border-bottom-color: var(--accent-2);
            border-left-color: var(--accent-1);
            animation: orbit3DB 5.2s linear infinite;
        }
        .ai-3d-logo-card {
            position: relative;
            width: 92px;
            height: 92px;
            border-radius: 28px;
            background: linear-gradient(145deg, rgba(35, 46, 82, 0.96), rgba(14, 18, 32, 0.98));
            border: 1.5px solid color-mix(in srgb, var(--accent-1) 45%, transparent);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3;
            box-shadow:
                0 12px 28px rgba(0, 0, 0, 0.65),
                0 0 24px color-mix(in srgb, var(--accent-1) 30%, transparent),
                inset 0 1px 1px rgba(255, 255, 255, 0.25);
            animation: logo3DAutoMove 5.5s ease-in-out infinite;
            transform-style: preserve-3d;
        }
        .ai-3d-emblem {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--accent-1), #ffffff, var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transform: translateZ(16px);
        }
        .ai-wave-bars {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 20px;
            margin-top: 4px;
            transform: translateZ(12px);
        }
        .ai-wave-bars span {
            width: 3.5px;
            height: 7px;
            border-radius: 4px;
            background: linear-gradient(180deg, var(--accent-1), var(--accent-2));
            animation: eqBounce 1.15s ease-in-out infinite;
        }
        .ai-wave-bars span:nth-child(2) { animation-delay: 0.14s; }
        .ai-wave-bars span:nth-child(3) { animation-delay: 0.28s; }
        .ai-wave-bars span:nth-child(4) { animation-delay: 0.42s; }
        .ai-wave-bars span:nth-child(5) { animation-delay: 0.56s; }

        @keyframes logo3DAutoMove {
            0% { transform: rotateX(12deg) rotateY(-18deg) translateY(0px); }
            25% { transform: rotateX(-10deg) rotateY(16deg) translateY(-6px); }
            50% { transform: rotateX(14deg) rotateY(18deg) translateY(2px); }
            75% { transform: rotateX(-12deg) rotateY(-16deg) translateY(-5px); }
            100% { transform: rotateX(12deg) rotateY(-18deg) translateY(0px); }
        }
        @keyframes orbit3DA {
            0% { transform: rotateX(62deg) rotateZ(0deg); }
            100% { transform: rotateX(62deg) rotateZ(360deg); }
        }
        @keyframes orbit3DB {
            0% { transform: rotateY(58deg) rotateZ(360deg); }
            100% { transform: rotateY(58deg) rotateZ(0deg); }
        }
        @keyframes haloPulse {
            0%, 100% { transform: scale(0.94); opacity: 0.7; }
            50% { transform: scale(1.12); opacity: 1; }
        }
        @keyframes eqBounce {
            0%, 100% { height: 6px; opacity: 0.65; }
            50% { height: 19px; opacity: 1; }
        }

        /* প্রিমিয়াম লগইন, সাইনআপ ও ফরগেট পাসওয়ার্ড কার্ড */
        .auth-box {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: auto 14px;
            overflow-y: auto;
            background: rgba(24, 30, 48, 0.78);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
        }
        .auth-title { text-align: center; font-size: 20px; font-weight: 700; letter-spacing: 0.3px; }
        .auth-sub { text-align: center; font-size: 13px; color: #b4bdd6; margin-bottom: 2px; }
        .tab-switch { display: flex; background: rgba(14, 18, 30, 0.85); border-radius: 12px; padding: 4px; gap: 4px; border: 1px solid rgba(255,255,255,0.06); }
        .tab-btn { flex: 1; padding: 8px; border: none; border-radius: 9px; background: transparent; color: #aeb8d2; font-weight: 600; cursor: pointer; font-size: 13px; transition: all 0.25s ease; }
        .tab-btn.active { background: var(--accent-btn); color: #fff; box-shadow: 0 4px 12px rgba(0, 123, 255, 0.35); }
        .auth-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 11px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(15, 19, 32, 0.88);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .auth-input:focus { border-color: var(--accent-1); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-1) 18%, transparent); }
        .forgot-row { display: flex; justify-content: flex-end; }
        .link-btn { background: none; border: none; color: var(--accent-1); font-size: 13px; cursor: pointer; padding: 2px 0; text-decoration: underline; }
        .primary-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 11px;
            background: var(--accent-btn);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 149, 255, 0.32);
        }
        .google-btn {
            width: 100%;
            padding: 11px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 11px;
            background: rgba(255, 255, 255, 0.96);
            color: #131722;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .auth-msg { font-size: 13px; text-align: center; min-height: 18px; color: #ff8a80; }
        .auth-msg.success { color: #69f0ae; }

        /* চ্যাট উইন্ডো, টাইমস্ট্যাম্প, কপি ও স্পিকার বাটন */
        #chat-window { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 84%; padding: 10px 13px; border-radius: 12px; font-size: 15px; line-height: 1.42; word-wrap: break-word; }
        .user { align-self: flex-end; background: #007bff; color: white; border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background: rgba(44, 52, 74, 0.92); color: #eef2fc; border-bottom-left-radius: 2px; border: 1px solid rgba(255,255,255,0.06); }
        .error-msg { align-self: flex-start; background: #4a1c1c; color: #ff8a80; border: 1px solid #ff5252; border-bottom-left-radius: 2px; font-size: 13px; }
        .status-msg { align-self: flex-start; background: rgba(37, 42, 58, 0.9); color: #c5cde0; font-size: 13px; font-style: italic; border-bottom-left-radius: 2px; }
        .chat-img { max-width: 100%; border-radius: 8px; margin-top: 6px; display: block; }
        .file-card {
            margin-top: 6px;
            padding: 8px 10px;
            border-radius: 9px;
            background: rgba(12, 16, 28, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.16);
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .dl-link { display: inline-block; margin-top: 8px; padding: 6px 12px; background: #28a745; color: #fff; text-decoration: none; border-radius: 8px; font-size: 13px; font-weight: bold; }

        .msg-meta {
            margin-top: 6px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.65);
        }
        .msg-footer {
            margin-top: 7px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .speaker-btn, .copy-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #8ceeff;
            border: 1px solid rgba(140, 238, 255, 0.25);
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .copy-btn.copied {
            background: rgba(40, 167, 69, 0.3);
            color: #98ffbe;
            border-color: rgba(152, 255, 190, 0.45);
        }
        .speaker-btn.speaking {
            background: rgba(255, 46, 147, 0.25);
            color: #ff80bf;
            border-color: rgba(255, 46, 147, 0.55);
        }

        /* সরাসরি লাইভ ভয়েস কথোপকথন ব্যানার */
        .live-voice-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 12px;
            background: linear-gradient(90deg, rgba(233, 30, 99, 0.24), rgba(0, 229, 255, 0.2));
            border-top: 1px solid rgba(255, 77, 166, 0.4);
            font-size: 12px;
            color: #fff;
            z-index: 8;
        }
        .live-voice-bar.active { display: flex; }
        .live-stop-btn {
            background: #ff2e55;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* কুইক প্রম্পট শর্টকাট বার */
        .quick-prompts {
            display: flex;
            gap: 6px;
            padding: 6px 10px;
            overflow-x: auto;
            background: rgba(20, 25, 40, 0.85);
            border-top: 1px solid rgba(255,255,255,0.05);
            scrollbar-width: none;
        }
        .quick-prompts::-webkit-scrollbar { display: none; }
        .qp-chip {
            white-space: nowrap;
            padding: 5px 10px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(36, 44, 70, 0.9);
            color: #dce4fa;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* বাম প্লাস (+) অ্যাটাচমেন্ট পপ-আপ মেনু */
        .plus-attach-sheet {
            display: none;
            position: absolute;
            left: 12px;
            bottom: 84px;
            width: 245px;
            background: rgba(20, 26, 44, 0.98);
            backdrop-filter: blur(16px);
            border: 1px solid color-mix(in srgb, var(--accent-1) 35%, transparent);
            border-radius: 16px;
            padding: 10px;
            z-index: 16;
            flex-direction: column;
            gap: 7px;
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.72);
        }

    function autoSaveMessageToSession(sender, text) {

        const now = Date.now();
        sess.messages.push({ sender, text, time: now });
        sess.updatedAt = now;
        if (sender === "user") {
            sess.title = text.slice(0, 32);
        }
        chatSessions.sort((a, b) => b.updatedAt - a.updatedAt);
        saveLocalSessions();

        addDoc(collection(db, "chat_history"), {
            sender,
            userId: currentUser?.uid || "guest",
            sessionId: currentSessionId,
            message: text,
            timestamp: new Date()
        }).catch(() => {});

    function pickBestVoice(type) {
        if (!('speechSynthesis' in window)) return null;
        const voices = window.speechSynthesis.getVoices() || [];
        if (!voices.length) return null;

        const bnVoices = voices.filter(v => /bn|bengali|bangla/i.test(v.lang) || /bangla|bengali/i.test(v.name));
        const pool = bnVoices.length > 0 ? bnVoices : voices;

        const femaleHints = /female|woman|girl|priya|tanisha|samantha|victoria|zira|google हिन्दी|google বাংলা|nita|lekha/i;
        const maleHints = /male|man|boy|rishi|prabhat|alex|daniel|david|google uk english male/i;

        if (type === "female") {
            return pool.find(v => femaleHints.test(v.name)) || pool[0];
        }
        if (type === "male") {
            return pool.find(v => maleHints.test(v.name)) || pool[pool.length > 1 ? 1 : 0];
        }
        return pool[0];
    }

    function speakTextWithSelectedVoice(textToSpeak, onCompleteCallback = null, btnEl = null) {
        if (!('speechSynthesis' in window) || !textToSpeak) {
            if (onCompleteCallback) onCompleteCallback();
            return;
        }

        window.speechSynthesis.cancel();
        resetAllSpeakerButtons();

        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        const chosenVoice = pickBestVoice(selectedVoiceType);
        if (chosenVoice) {
            utterance.voice = chosenVoice;
        }
        utterance.lang = chosenVoice?.lang || 'bn-BD';
        utterance.rate = selectedVoiceSpeed;

        if (selectedVoiceType === "female") {
            utterance.pitch = 1.24;
        } else if (selectedVoiceType === "male") {
            utterance.pitch = 0.78;
        } else {
            utterance.pitch = 1.0;
        }

        if (btnEl) {
            activeSpeakerBtn = btnEl;
            btnEl.classList.add("speaking");
            btnEl.innerHTML = "⏹ থামুন";
        }

        utterance.onend = () => {
            resetAllSpeakerButtons();
            if (onCompleteCallback) onCompleteCallback();
        };
        utterance.onerror = () => {
            resetAllSpeakerButtons();
            if (onCompleteCallback) onCompleteCallback();
        };

        window.speechSynthesis.speak(utterance);
    }

    function isNonChatModel(id) {
        return /orpheus|whisper|tts|audio|guard|safeguard|embed|vision-only/i.test(id);

    async function refreshChatModels() {
        try {
            const res = await fetch("https://api.groq.com/openai/v1/models", {
                headers: { "Authorization": `Bearer ${GROQ_API_KEY}` }
            });
            const data = await res.json();
            if (Array.isArray(data.data) && data.data.length > 0) {
                const chatIds = data.data
                    .map(m => m.id)
                    .filter(id => !isNonChatModel(id));

                const preferred = [
                    "llama-3.1-8b-instant",
                    "llama-3.3-70b-versatile",
                    "gemma2-9b-it"
                ];

                const ordered = [
                    ...preferred.filter(p => chatIds.includes(p)),
                    ...chatIds.filter(id => !preferred.includes(id))
                ];

                if (ordered.length > 0) {
                    candidateModels = ordered;
                }
            }
        } catch (_) {}
    }

    function buildRecentMessagesForContext() {
        const sess = chatSessions.find(s => s.id === currentSessionId);
        if (!sess || !Array.isArray(sess.messages)) return [];
        return sess.messages
            .slice(-6)
            .map(m => ({
                role: m.sender === "user" ? "user" : "assistant",
                content: String(m.text || "").slice(0, 800)
            }));
    }

    async function callGroqChat(modelName, systemPrompt, userText) {
        const historyContext = buildRecentMessagesForContext();
        const messagesPayload = [
            { role: "system", content: systemPrompt },
            ...historyContext,
            { role: "user", content: userText }
        ];

        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${GROQ_API_KEY}`
            },
            body: JSON.stringify({
                model: modelName,
                messages: messagesPayload,
                temperature: 0.7
            })
        });
        return await response.json();
    }

    window.handleSend = async (textToSend = null, options = {}) => {
        const isFromLiveVoice = Boolean(options.isFromLiveVoice);
        const input = document.getElementById('userInput');
        const text = textToSend || input.value.trim();
        if (!text) return;

        const nowTs = Date.now();
        appendMessage(text, 'user', null, null, false, true, nowTs);
        if (!textToSend) input.value = '';

        if (isCreatorQuestion(text)) {
            appendMessage(CREATOR_REPLY, "ai", null, null, true, true, Date.now());
            if (isFromLiveVoice && liveConversationActive) {
                setLiveBanner("🔊 Ridoy AI বলছে...");
                speakTextWithSelectedVoice(CREATOR_REPLY, () => {
                    if (liveConversationActive) listenOnceInLiveMode();
                });
            }
            return;
        }

        if (isHomeAddressQuestion(text)) {
            appendMessage(HOME_ADDRESS_REPLY, "ai", null, null, true, true, Date.now());
            if (isFromLiveVoice && liveConversationActive) {
                setLiveBanner("🔊 Ridoy AI বলছে...");
                speakTextWithSelectedVoice(HOME_ADDRESS_REPLY, () => {
                    if (liveConversationActive) listenOnceInLiveMode();
                });
            }
            return;
        }

        const memoryPart = savedMemories.length > 0
            ? `\nঅতিরিক্ত মেমোরি:\n- ${savedMemories.join("\n- ")}`
            : "";

        const systemPrompt = `তুমি Ridoy AI। কেউ যদি জিজ্ঞাসা করে তোমাকে কে তৈরি করেছে বা কে বানিয়েছে, তাহলে উত্তর দেবে: "${CREATOR_REPLY}" কেউ যদি হৃদয় স্যারের বাসা বা ঠিকানা সম্পর্কে জিজ্ঞাসা করে, তাহলে উত্তর দেবে: "${HOME_ADDRESS_REPLY}" ${isFromLiveVoice ? "সরাসরি কথোপকথনের মতো স্বাভাবিক, সাবলীল ও সংক্ষিপ্তভাবে উত্তর দাও।" : "বাংলায় সংক্ষিপ্ত ও স্পষ্টভাবে উত্তর দাও।"}${memoryPart}`;
        const statusEl = appendMessage("ভাবছি...", "status-msg", null, null, false, false, Date.now());
        if (isFromLiveVoice && liveConversationActive) {
            setLiveBanner("🤔 উত্তর তৈরি হচ্ছে...");
        }

        try {
            let data = null;

            for (let i = 0; i < candidateModels.length; i++) {
                const modelName = candidateModels[i];
                data = await callGroqChat(modelName, systemPrompt, text);

                if (!data.error) {
                    candidateModels.splice(i, 1);
                    candidateModels.unshift(modelName);
                    break;
                }

                const errMsg = data.error.message || "";
                const shouldTryNext =
                    /does not exist|do not have access|requires terms acceptance|decommissioned|not found/i.test(errMsg);

                if (!shouldTryNext) {
                    break;
                }
            }

            statusEl.remove();

            if (data?.error) {
                appendMessage(`❌ API Error: ${data.error.message}`, "error-msg", null, null, false, false, Date.now());
                if (isFromLiveVoice && liveConversationActive) listenOnceInLiveMode();
                return;
            }

            const reply = data?.choices?.[0]?.message?.content;
            if (!reply) {
                appendMessage("⚠️ কোনো উত্তর পাওয়া যায়নি।", "error-msg", null, null, false, false, Date.now());
                if (isFromLiveVoice && liveConversationActive) listenOnceInLiveMode();
                return;
            }

            appendMessage(reply, "ai", null, null, true, true, Date.now());

            if (isFromLiveVoice && liveConversationActive) {
                setLiveBanner("🔊 Ridoy AI সরাসরি বলছে...");
                speakTextWithSelectedVoice(reply, () => {
                    if (liveConversationActive) {
                        listenOnceInLiveMode();
                    }
                });
            }
        } catch (error) {
            statusEl.remove();
            appendMessage(`❌ কানেকশন এরর: ${error.message}`, "error-msg", null, null, false, false, Date.now());
            if (isFromLiveVoice && liveConversationActive) listenOnceInLiveMode();
        }
    };

    function appendMessage(text, sender, imageDataUrl = null, downloadName = null, showSpeaker = false, shouldPersist = true, ts = Date.now(), fileInfo = null) {
        const win = document.getElementById('chat-window');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        if (text) {
            const textSpan = document.createElement('div');
            textSpan.innerText = text;
            msgDiv.appendChild(textSpan);
        }
        if (fileInfo) {
            const fCard = document.createElement('div');
            fCard.className = 'file-card';
            fCard.innerHTML = `<div><strong>📄 ${escapeHtml(fileInfo.name)}</strong></div><div>${escapeHtml(fileInfo.sizeText)}</div>`;
            msgDiv.appendChild(fCard);
        }
        if (imageDataUrl) {
            const img = document.createElement('img');
            img.src = imageDataUrl;
            img.className = 'chat-img';
            msgDiv.appendChild(img);

            if (downloadName) {
                const dl = document.createElement('a');
                dl.href = imageDataUrl;
                dl.download = downloadName;
                dl.className = 'dl-link';
                dl.innerText = '⬇ ছবি ডাউনলোড করুন';
                msgDiv.appendChild(dl);
            }
        }

        if (sender === "user" || sender === "ai") {
            const meta = document.createElement('div');
            meta.className = 'msg-meta';
            meta.innerText = formatTimeNow(ts);
            msgDiv.appendChild(meta);
        }

        if ((showSpeaker || sender === "ai") && text) {
            const footer = document.createElement('div');
            footer.className = 'msg-footer';

            if (showSpeaker) {
                const spkBtn = document.createElement('button');
                spkBtn.type = 'button';
                spkBtn.className = 'speaker-btn';
                spkBtn.innerHTML = '🔊 শুনুন';
                spkBtn.onclick = () => window.toggleSpeakMessage(spkBtn, text);
                footer.appendChild(spkBtn);
            }

            const cpBtn = document.createElement('button');
            cpBtn.type = 'button';
            cpBtn.className = 'copy-btn';
            cpBtn.innerHTML = '📋 কপি';
            cpBtn.onclick = () => window.copyMessageText(cpBtn, text);
            footer.appendChild(cpBtn);

            msgDiv.appendChild(footer);
        }

        win.appendChild(msgDiv);
        win.scrollTop = win.scrollHeight;

        if (shouldPersist && (sender === "user" || sender === "ai") && text) {
            autoSaveMessageToSession(sender, text);
        }

        return msgDiv;
    }

    // বাম প্লাস (+) মেনু অ্যাকশনসমূহ: গ্যালারি এডিট, সরাসরি ফটো ও ফাইল/ডকুমেন্টস
    window.chooseGalleryEdit = () => {
        closeAllOverlays();
        const inp = document.getElementById("imageEditInput");
        inp.value = "";
        inp.click();
    };

    window.chooseDirectPhoto = () => {
        closeAllOverlays();
        const inp = document.getElementById("directPhotoInput");
        inp.value = "";
        inp.click();
    };

    window.chooseDocumentFile = () => {
        closeAllOverlays();
        const inp = document.getElementById("docFileInput");
        inp.value = "";
        inp.click();
    };

    window.handleDirectPhotoSelect = (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            appendMessage(`ছবি পাঠানো হয়েছে: ${file.name}`, "user", e.target.result, null, false, true, Date.now());
        };
        reader.readAsDataURL(file);
    };

    window.handleDocumentFileSelect = async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;

        const kb = (file.size / 1024).toFixed(1);
        const sizeText = file.size > 1024 * 1024 ? `${(file.size / (1024 * 1024)).toFixed(2)} MB` : `${kb} KB`;

        let extractedText = "";
        const isReadableText = /\.(txt|csv|json|md|html|htm|js|css|xml|log|py|php)$/i.test(file.name) || /^text\//i.test(file.type);
        if (isReadableText && file.size < 250000) {
            try {
                extractedText = await file.text();
            } catch (_) {}
        }

        const displaySummary = `ফাইল/ডকুমেন্ট পাঠানো হয়েছে: ${file.name}`;
        appendMessage(displaySummary, "user", null, null, false, true, Date.now(), {
            name: file.name,
            sizeText
        });

        if (extractedText.trim()) {
            const promptForAi = `ব্যবহারকারী "${file.name}" নামের একটি ডকুমেন্ট ফাইল পাঠিয়েছেন। এর সারসংক্ষেপ বা মূল বিষয় বাংলায় বুঝিয়ে বলো:\n\n${extractedText.slice(0, 4000)}`;
            await handleSend(promptForAi);
        }
    };

    let currentSelectedDataUrl = "";
    let modalRotationDeg = 0;
    let modalFlipX = 1;

    function updateModalPreviewTransform() {
        const imgEl = document.getElementById("selectedOriginalPreview");
        imgEl.style.transform = `rotate(${modalRotationDeg}deg) scaleX(${modalFlipX})`;
    }

    window.rotateModalImage = () => {
        modalRotationDeg = (modalRotationDeg + 90) % 360;
        updateModalPreviewTransform();
    };

    window.flipModalImage = () => {
        modalFlipX = modalFlipX * -1;
        updateModalPreviewTransform();
    };

    window.handleImageEditFileSelect = (event) => {
        const file = event.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            currentSelectedDataUrl = e.target.result;
            modalRotationDeg = 0;
            modalFlipX = 1;
            const imgEl = document.getElementById("selectedOriginalPreview");
            imgEl.src = currentSelectedDataUrl;
            updateModalPreviewTransform();
            document.getElementById("imgEditPrompt").value = "";
            document.getElementById("aiImageModal").classList.add("active");
        };
        reader.readAsDataURL(file);
    };

    window.closeAiImageModal = () => {
        document.getElementById("aiImageModal").classList.remove("active");
    };

    function buildSmartEditCanvas(imgEl, promptText, rotDeg, flipX) {
        const p = (promptText || "").toLowerCase();
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        const maxDim = 900;
        let w = imgEl.naturalWidth || imgEl.width;
        let h = imgEl.naturalHeight || imgEl.height;
        if (w > maxDim || h > maxDim) {
            const ratio = Math.min(maxDim / w, maxDim / h);
            w = Math.round(w * ratio);
            h = Math.round(h * ratio);
        }

        const swap = (rotDeg % 180) !== 0;
        canvas.width = swap ? h : w;
        canvas.height = swap ? w : h;

        let filterStr = "brightness(106%) contrast(112%) saturate(120%)";

        if (/black|white|b&w|bw|সাদা কালো|সাদাকালো|mono|grey|gray/.test(p)) {
            filterStr = "grayscale(100%) contrast(120%) brightness(104%)";
        } else if (/vintage|retro|old|ভিন্টেজ|পুরানো/.test(p)) {
            filterStr = "sepia(55%) contrast(110%) brightness(98%) saturate(85%)";
        } else if (/warm|golden|sunset|গরম|সোনালি/.test(p)) {
            filterStr = "sepia(28%) saturate(135%) contrast(110%) brightness(106%)";
        } else if (/cool|cyber|neon|night|নীল|নিয়ন|রাত/.test(p)) {
            filterStr = "hue-rotate(190deg) saturate(140%) contrast(118%) brightness(102%)";
        } else if (/bright|glow|light|উজ্জ্বল|আলো/.test(p)) {
            filterStr = "brightness(122%) contrast(108%) saturate(118%)";
        } else if (/soft|blur|dream|anime|cartoon|সফট|ব্লার|এনিমে|কার্টুন/.test(p)) {
            filterStr = "contrast(118%) saturate(145%) brightness(108%)";
        }

        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate((rotDeg * Math.PI) / 180);
        ctx.scale(flipX, 1);
        ctx.filter = filterStr;
        ctx.drawImage(imgEl, -w / 2, -h / 2, w, h);
        ctx.restore();

        return canvas.toDataURL("image/jpeg", 0.9);
    }

    window.processAiImageEdit = async () => {
        const promptText = document.getElementById("imgEditPrompt").value.trim() || "enhance photo quality naturally";
        const imgData = currentSelectedDataUrl;
        if (!imgData) return;

        const rotSnapshot = modalRotationDeg;
        const flipSnapshot = modalFlipX;

        closeAiImageModal();
        appendMessage(`নির্দেশনা: "${promptText}"`, "user", imgData, null, false, true, Date.now());
        const statusEl = appendMessage("ছবি অটোমেটিক এডিট করা হচ্ছে...", "status-msg", null, null, false, false, Date.now());

        try {
            const tempImg = new Image();
            tempImg.src = imgData;
            await new Promise((resolve, reject) => {
                tempImg.onload = resolve;
                tempImg.onerror = reject;
            });

            const editedUrl = buildSmartEditCanvas(tempImg, promptText, rotSnapshot, flipSnapshot);
            statusEl.remove();
            appendMessage(
                `আপনার নির্দেশনা ("${promptText}") অনুযায়ী ছবিটি এডিট করা হয়েছে:`,
                "ai",
                editedUrl,
                `ridoy-ai-edit-${Date.now()}.jpg`,
                true,
                true,
                Date.now()
            );
        } catch (err) {
            statusEl.remove();
            appendMessage(`❌ ছবি এডিট করতে সমস্যা হয়েছে: ${err.message}`, "error-msg", null, null, false, false, Date.now());
        }
    };

    // সরাসরি লাইভ ভয়েস কথোপকথন (আপনি প্রশ্ন বলবেন -> AI সরাসরি ভয়েসে উত্তর দেবে -> আবার শুনবে)
    function setLiveBanner(msg) {
        const el = document.getElementById("liveVoiceStatusText");
        if (el) el.innerText = msg;
    }

    function listenOnceInLiveMode() {
        if (!liveConversationActive) return;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            appendMessage("⚠️ এই ব্রাউজারে লাইভ ভয়েস সাপোর্ট করে না। Google Chrome ব্যবহার করুন।", "error-msg", null, null, false, false, Date.now());
            stopLiveVoiceConversation();
            return;
        }

        if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
            appendMessage("⚠️ লাইভ মাইক্রোফোন ব্যবহারের জন্য পেজটি HTTPS লিংকে ওপেন করুন।", "error-msg", null, null, false, false, Date.now());
            stopLiveVoiceConversation();
            return;
        }

        try {
            if (liveRecognition) {
                liveRecognition.abort();
            }
        } catch (_) {}

        const recognition = new SpeechRecognition();
        liveRecognition = recognition;
        recognition.lang = 'bn-BD';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        const voiceBtn = document.getElementById('voiceBtn');
        voiceBtn.classList.add('listening');
        setLiveBanner("🎤 শুনছি... আপনার প্রশ্ন বলুন");

        let gotSpeech = false;

        recognition.onresult = (event) => {
            gotSpeech = true;
            const transcript = event.results?.[0]?.[0]?.transcript?.trim();
            if (transcript && liveConversationActive) {
                setLiveBanner(`🗣️ আপনি বলেছেন: "${transcript}"`);
                handleSend(transcript, { isFromLiveVoice: true });
            } else if (liveConversationActive) {
                listenOnceInLiveMode();
            }
        };

        recognition.onerror = (event) => {
            if (!liveConversationActive) return;
            if (event.error === "not-allowed") {
                appendMessage("❌ মাইক্রোফোন অনুমতি দেওয়া হয়নি। ব্রাউজার সেটিংস থেকে Microphone Allow করুন।", "error-msg", null, null, false, false, Date.now());
                stopLiveVoiceConversation();
                return;
            }
            if (event.error === "no-speech") {
                setLiveBanner("🎤 আবার বলুন, শুনছি...");
                setTimeout(() => {
                    if (liveConversationActive) listenOnceInLiveMode();
                }, 350);
                return;
            }
            setTimeout(() => {
                if (liveConversationActive) listenOnceInLiveMode();
            }, 600);
        };

        recognition.onend = () => {
            if (!liveConversationActive) {
                voiceBtn.classList.remove('listening');
                return;
            }
            if (!gotSpeech && !(window.speechSynthesis && window.speechSynthesis.speaking)) {
                setTimeout(() => {
                    if (liveConversationActive) listenOnceInLiveMode();
                }, 300);
            }
        };

        try {
            recognition.start();
        } catch (_) {
            setTimeout(() => {
                if (liveConversationActive) listenOnceInLiveMode();
            }, 500);
        }
    }

    window.toggleLiveVoiceConversation = () => {
        if (liveConversationActive) {
            stopLiveVoiceConversation();
        } else {
            liveConversationActive = true;
            document.getElementById("liveVoiceBar").classList.add("active");
            document.getElementById("voiceBtn").classList.add("listening");
            listenOnceInLiveMode();
        }
    };

    window.stopLiveVoiceConversation = () => {
        liveConversationActive = false;
        document.getElementById("liveVoiceBar").classList.remove("active");
        document.getElementById("voiceBtn").classList.remove("listening");
        try {
            if (liveRecognition) {
                liveRecognition.abort();
                liveRecognition = null;
            }
        } catch (_) {}
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            resetAllSpeakerButtons();
        }
    };
</script>
