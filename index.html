<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ridoy AI - ChatGPT Style Assistant</title>
    <style>
        :root {
            --accent-1: #10a37f;
            --accent-2: #00d4ff;
            --accent-btn: linear-gradient(135deg, #10a37f, #0b7285);
            --bg-main: #0d0f14;
            --bg-panel: #151821;
            --bg-bubble-ai: #1c202c;
            --bg-bubble-user: #10a37f;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            margin: 0;
            padding: 10px 8px calc(16px + env(safe-area-inset-bottom));
            background: radial-gradient(circle at 50% 0%, #192234 0%, #0b0d12 70%);
            color: #f3f5f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            height: 100dvh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            height: 100%;
            max-height: 840px;
            background: var(--bg-panel);
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 22px 60px rgba(0, 0, 0, 0.78), 0 0 0 1px rgba(255, 255, 255, 0.08);
            position: relative;
        }

        /* হেডার */
        .header {
            background: rgba(21, 24, 33, 0.96);
            backdrop-filter: blur(12px);
            padding: 11px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 10;
            gap: 8px;
        }
        .header-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .logo-box {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            border: 1px solid rgba(255, 255, 255, 0.25);
            flex-shrink: 0;
        }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22e584;
            box-shadow: 0 0 8px #22e584;
            flex-shrink: 0;
        }
        .status-dot.offline {
            background: #ff5252;
            box-shadow: 0 0 8px #ff5252;
        }

        .dots-btn {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* মেনু ব্যাকড্রপ ও ড্রপডাউন */
        .menu-backdrop {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 14;
        }
        .menu-backdrop.active { display: block; }

        .dot-dropdown {
            display: none;
            position: absolute;
            top: 56px;
            width: 280px;
            max-height: 76%;
            background: #181c28;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 12px;
            z-index: 15;
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.75);
            flex-direction: column;
            gap: 9px;
            overflow-y: auto;
        }
        .dot-dropdown.left-menu { left: 10px; }
        .dot-dropdown.right-menu { right: 10px; }
        .dot-dropdown.active { display: flex; }

        .menu-gmail-box {
            background: #10131c;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 11px;
            padding: 9px 11px;
        }
        .menu-gmail-label { font-size: 11px; color: var(--accent-1); font-weight: 700; }
        .menu-gmail-value { font-size: 13px; color: #ffffff; word-break: break-all; margin-top: 2px; }

        .new-chat-btn {
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-radius: 10px;
            background: var(--accent-btn);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .saved-chats-title { font-size: 12px; color: #aab3c8; font-weight: 700; margin-top: 2px; }
        .saved-chat-list { display: flex; flex-direction: column; gap: 6px; }
        .saved-chat-row { display: flex; align-items: center; gap: 5px; }
        .saved-chat-item {
            flex: 1;
            min-width: 0;
            background: #222736;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 7px 9px;
            cursor: pointer;
            text-align: left;
            color: #eef2fc;
            font-size: 12px;
        }
        .saved-chat-item.active {
            border-color: var(--accent-1);
            background: rgba(16, 163, 127, 0.18);
        }
        .saved-chat-snippet { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
        .saved-chat-meta { font-size: 10px; color: #8f99b3; margin-top: 2px; }
        .del-chat-btn {
            width: 30px;
            height: 36px;
            border-radius: 9px;
            border: 1px solid rgba(255, 110, 130, 0.3);
            background: rgba(110, 25, 40, 0.7);
            color: #ff99a8;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .voice-option-btn {
            width: 100%;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: #222736;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .voice-option-btn.selected {
            border-color: var(--accent-1);
            background: rgba(16, 163, 127, 0.22);
            color: #7ef9d4;
        }

        .speed-row { display: flex; gap: 5px; }
        .speed-btn {
            flex: 1;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.12);
            background: #222736;
            color: #cfd7ee;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .speed-btn.active {
            border-color: var(--accent-1);
            background: rgba(16, 163, 127, 0.25);
            color: #fff;
        }

        .theme-row { display: flex; gap: 6px; }
        .theme-chip {
            flex: 1;
            padding: 7px 6px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.14);
            background: #222736;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }
        .theme-chip.active { border-color: #fff; }

        .menu-action-row { display: flex; gap: 6px; }
        .menu-sec-btn {
            flex: 1;
            padding: 8px;
            border-radius: 9px;
            border: 1px solid rgba(255,255,255,0.12);
            background: #262c3d;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .menu-sec-btn.danger { background: rgba(122, 28, 44, 0.85); border-color: rgba(255,110,130,0.35); }

        /* স্ক্রিন */
        .screen { display: none; flex: 1; flex-direction: column; overflow: hidden; position: relative; z-index: 2; }
        .screen.active { display: flex; }

        /* লগইন / সাইনআপ স্ক্রিন */
        .auth-box {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 11px;
            margin: auto 14px;
            overflow-y: auto;
            background: #181c28;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }
        .auth-title { text-align: center; font-size: 20px; font-weight: 700; }
        .auth-sub { text-align: center; font-size: 13px; color: #a7b1c8; margin-bottom: 2px; }
        .tab-switch { display: flex; background: #10131c; border-radius: 12px; padding: 4px; gap: 4px; }
        .tab-btn { flex: 1; padding: 8px; border: none; border-radius: 9px; background: transparent; color: #a7b1c8; font-weight: 600; cursor: pointer; font-size: 13px; }
        .tab-btn.active { background: var(--accent-btn); color: #fff; }
        .auth-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 11px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: #10131c;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .auth-input:focus { border-color: var(--accent-1); }
        .forgot-row { display: flex; justify-content: flex-end; }
        .link-btn { background: none; border: none; color: var(--accent-1); font-size: 13px; cursor: pointer; padding: 2px 0; text-decoration: underline; }
        .primary-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 11px;
            background: var(--accent-btn);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        .google-btn {
            width: 100%;
            padding: 11px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 11px;
            background: #ffffff;
            color: #131722;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .auth-msg { font-size: 13px; text-align: center; min-height: 18px; color: #ff8a80; }
        .auth-msg.success { color: #69f0ae; }

        /* চ্যাট উইন্ডো */
        #chat-window { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 11px 14px; border-radius: 14px; font-size: 15px; line-height: 1.48; word-wrap: break-word; white-space: pre-wrap; }
        .user { align-self: flex-end; background: var(--bg-bubble-user); color: #ffffff; border-bottom-right-radius: 4px; }
        .ai { align-self: flex-start; background: var(--bg-bubble-ai); color: #f0f3f9; border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.07); }
        .error-msg { align-self: flex-start; background: #3b171c; color: #ff8a80; border: 1px solid #ff5252; font-size: 13px; }
        .status-msg { align-self: flex-start; background: #1b202e; color: #b7c2da; font-size: 13px; font-style: italic; }

        .chat-img { max-width: 100%; border-radius: 10px; margin-top: 8px; display: block; border: 1px solid rgba(255,255,255,0.12); }
        .file-card {
            margin-top: 8px;
            padding: 8px 10px;
            border-radius: 9px;
            background: rgba(10, 13, 20, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.14);
            font-size: 12px;
        }
        .dl-link {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 12px;
            background: #10a37f;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
        }

        .msg-meta { margin-top: 6px; font-size: 10px; color: rgba(255, 255, 255, 0.6); }
        .msg-footer { margin-top: 7px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
        .speaker-btn, .copy-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #8ceeff;
            border: 1px solid rgba(140, 238, 255, 0.22);
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
        }
        .copy-btn.copied {
            background: rgba(16, 163, 127, 0.3);
            color: #98ffbe;
            border-color: rgba(152, 255, 190, 0.45);
        }
        .speaker-btn.speaking {
            background: rgba(255, 46, 147, 0.25);
            color: #ff80bf;
            border-color: rgba(255, 46, 147, 0.55);
        }

        /* লাইভ ভয়েস ব্যানার */
        .live-voice-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(16, 163, 127, 0.22);
            border-top: 1px solid rgba(16, 163, 127, 0.45);
            font-size: 12px;
            color: #fff;
            z-index: 8;
        }
        .live-voice-bar.active { display: flex; }
        .live-stop-btn {
            background: #e53935;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* কুইক প্রম্পট বার */
        .quick-prompts {
            display: flex;
            gap: 6px;
            padding: 6px 10px;
            overflow-x: auto;
            background: #151821;
            border-top: 1px solid rgba(255,255,255,0.06);
            scrollbar-width: none;
        }
        .quick-prompts::-webkit-scrollbar { display: none; }
        .qp-chip {
            white-space: nowrap;
            padding: 5px 10px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.12);
            background: #202534;
            color: #e4eaf7;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* বাম প্লাস (+) মেনু */
        .plus-attach-sheet {
            display: none;
            position: absolute;
            left: 12px;
            bottom: 84px;
            width: 260px;
            background: #181c28;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 16px;
            padding: 10px;
            z-index: 16;
            flex-direction: column;
            gap: 7px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.75);
        }
        .plus-attach-sheet.active { display: flex; }
        .attach-opt-btn {
            width: 100%;
            padding: 10px 12px;
            border-radius: 11px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #222736;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ছবি এডিট মোডাল */
        #aiImageModal {
            display: none;
            position: absolute;
            inset: 0;
            background: #12151e;
            z-index: 20;
            flex-direction: column;
            padding: 15px;
            gap: 10px;
            overflow-y: auto;
        }
        #aiImageModal.active { display: flex; }
        .modal-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3042; padding-bottom: 8px; }
        .preview-box { background: #0c0e14; border-radius: 10px; padding: 10px; display: flex; justify-content: center; align-items: center; min-height: 155px; max-height: 205px; overflow: hidden; }
        .preview-box img { max-width: 100%; max-height: 185px; border-radius: 8px; }
        .img-transform-row { display: flex; gap: 8px; }
        .img-tool-btn { flex: 1; padding: 8px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.14); background: #222736; color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; }
        #imgEditPrompt { width: 100%; padding: 11px; border-radius: 10px; border: 1px solid #353c52; background: #1b202e; color: #fff; font-size: 14px; outline: none; min-height: 68px; resize: vertical; }
        .modal-actions { display: flex; gap: 8px; margin-top: auto; }
        .action-btn { flex: 1; padding: 11px; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; color: #fff; }
        .btn-cancel { background: #373e52; }
        .btn-generate { background: #10a37f; }

        /* ইনপুট এরিয়া */
        .input-area {
            display: flex;
            padding: 9px 12px 13px;
            margin-bottom: 14px;
            background: #181c28;
            gap: 7px;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.08);
            border-radius: 0 0 20px 20px;
        }
        #userInput {
            flex: 1;
            padding: 11px 14px;
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,0.12);
            background: #23293a;
            color: white;
            outline: none;
            font-size: 15px;
            min-width: 0;
        }
        #userInput:focus { border-color: var(--accent-1); }
        .btn { width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .plus-btn { background: #242a3b; color: #fff; border: 1px solid rgba(255,255,255,0.14); font-weight: 700; }
        .send-btn { background: var(--accent-btn); color: white; font-size: 16px; }
        .voice-btn { background: #2d3448; color: white; border: 1px solid rgba(255,255,255,0.14); font-size: 16px; }
        .voice-btn.listening { animation: pulse 1s infinite; background: #e53935; border-color: #ff8a80; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="menu-backdrop" id="menuBackdrop" onclick="closeAllOverlays()"></div>

    <!-- বাম থ্রি-ডট মেনু -->
    <div class="dot-dropdown left-menu" id="leftDotMenu">
        <div class="menu-gmail-box">
            <div class="menu-gmail-label">লগইন জিমেইল</div>
            <div class="menu-gmail-value" id="leftMenuGmail">লগইন করা নেই</div>
        </div>

        <button type="button" class="new-chat-btn" onclick="startNewChatSession()">➕ নিউ চ্যাট</button>

        <div class="saved-chats-title">💾 সেভ হওয়া চ্যাট</div>
        <div class="saved-chat-list" id="savedChatList">
            <div class="saved-chat-meta">এখনও কোনো চ্যাট সেভ হয়নি।</div>
        </div>
    </div>

    <!-- ডান থ্রি-ডট মেনু -->
    <div class="dot-dropdown right-menu" id="rightDotMenu">
        <div class="menu-gmail-box">
            <div class="menu-gmail-label">অ্যাকাউন্ট জিমেইল</div>
            <div class="menu-gmail-value" id="rightMenuGmail">লগইন করা নেই</div>
        </div>

        <div class="saved-chats-title">🎙️ ভয়েস নির্বাচন</div>
        <button type="button" class="voice-option-btn selected" id="voiceOptFemale" onclick="selectVoiceProfile('female')">
            <span>👩 মেয়ে মানুষের ভয়েস</span>
            <span id="checkFemale">✓</span>
        </button>
        <button type="button" class="voice-option-btn" id="voiceOptMale" onclick="selectVoiceProfile('male')">
            <span>👨 ছেলে মানুষের ভয়েস</span>
            <span id="checkMale"></span>
        </button>
        <button type="button" class="voice-option-btn" id="voiceOptNatural" onclick="selectVoiceProfile('natural')">
            <span>🤖 ন্যাচারাল ভয়েস</span>
            <span id="checkNatural"></span>
        </button>

        <div class="saved-chats-title">⚡ ভয়েস স্পিড</div>
        <div class="speed-row">
            <button type="button" class="speed-btn" id="speed08" onclick="selectVoiceSpeed(0.8)">0.8x</button>
            <button type="button" class="speed-btn active" id="speed10" onclick="selectVoiceSpeed(1.0)">1.0x</button>
            <button type="button" class="speed-btn" id="speed12" onclick="selectVoiceSpeed(1.15)">1.15x</button>
        </div>

        <div class="saved-chats-title">🎨 থিম</div>
        <div class="theme-row">
            <button type="button" class="theme-chip active" id="themeEmerald" onclick="selectThemeColor('emerald')">Emerald</button>
            <button type="button" class="theme-chip" id="themeCyber" onclick="selectThemeColor('cyber')">Cyan</button>
            <button type="button" class="theme-chip" id="themeRoyal" onclick="selectThemeColor('royal')">Violet</button>
        </div>

        <div class="menu-action-row" style="margin-top:4px;">
            <button type="button" class="menu-sec-btn danger" onclick="closeAllOverlays(); handleLogout();">লগআউট</button>
        </div>
    </div>

    <!-- হেডার -->
    <div class="header">
        <div class="header-left">
            <button type="button" class="dots-btn" id="leftDotsBtn" style="display:none;" onclick="toggleDotMenu('left')" title="চ্যাট ও জিমেইল মেনু">⋮</button>
            <div class="logo-box">
                <img id="headerLogoImg" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%2310a37f'/><text x='50' y='64' font-size='44' font-family='Arial, sans-serif' font-weight='bold' fill='white' text-anchor='middle'>R</text></svg>" alt="Ridoy AI Logo">
            </div>
            <span id="headerTitle">Ridoy AI</span>
            <span class="status-dot" id="netStatusDot" title="অনলাইন"></span>
        </div>
        <button type="button" class="dots-btn" id="rightDotsBtn" style="display:none;" onclick="toggleDotMenu('right')" title="ভয়েস ও সেটিংস মেনু">⋮</button>
    </div>

    <!-- ১. লগইন / সাইনআপ / ফরগেট পাসওয়ার্ড -->
    <div id="authScreen" class="screen active">
        <div class="auth-box">
            <div class="auth-title" id="authHeading">Ridoy AI-তে লগইন করুন</div>

    function pickBestVoice(type) {
        if (!('speechSynthesis' in window)) return null;
        const voices = window.speechSynthesis.getVoices() || [];
        if (!voices.length) return null;

        const bnVoices = voices.filter(v => /bn|bengali|bangla|hi|hindi/i.test(v.lang) || /bangla|bengali/i.test(v.name));
        const pool = bnVoices.length > 0 ? bnVoices : voices;

        const femaleHints = /female|woman|girl|priya|tanisha|samantha|victoria|zira|nita|lekha|google/i;
        const maleHints = /male|man|boy|rishi|prabhat|alex|daniel|david/i;

        if (type === "female") {
            return pool.find(v => femaleHints.test(v.name)) || pool[0];
        }
        if (type === "male") {
            return pool.find(v => maleHints.test(v.name)) || pool[pool.length > 1 ? 1 : 0];
        }
        return pool[0];
    }

    function splitIntoClearChunks(text) {
        const cleaned = String(text || "")
            .replace(/[*#_`~]/g, " ")
            .replace(/\s+/g, " ")
            .trim();
        if (!cleaned) return [];

        const parts = cleaned.match(/[^।.!?;\n]+[।.!?;\n]?/g) || [cleaned];
        const chunks = [];
        let buf = "";

        for (const p of parts) {
            const part = p.trim();
            if (!part) continue;
            if ((buf + " " + part).length > 180 && buf) {
                chunks.push(buf.trim());
                buf = part;
            } else {
                buf = buf ? (buf + " " + part) : part;
            }
        }
        if (buf.trim()) chunks.push(buf.trim());
        return chunks;
    }

    function speakTextClear(textToSpeak, onCompleteCallback = null, btnEl = null) {

        speechCancelledManually = false;
        window.speechSynthesis.cancel();
        resetAllSpeakerButtons();

        const chunks = splitIntoClearChunks(textToSpeak);
        if (!chunks.length) {
            if (onCompleteCallback) onCompleteCallback();
            return;

        if (btnEl) {
            activeSpeakerBtn = btnEl;
            btnEl.classList.add("speaking");
            btnEl.innerHTML = "⏹ থামুন";
        }

        const chosenVoice = pickBestVoice(selectedVoiceType);
        let idx = 0;

        const playNextChunk = () => {
            if (speechCancelledManually || idx >= chunks.length) {
                resetAllSpeakerButtons();
                if (!speechCancelledManually && onCompleteCallback) {
                    onCompleteCallback();
                }
                return;
            }

            const utterance = new SpeechSynthesisUtterance(chunks[idx]);
            idx++;

            if (chosenVoice) {
                utterance.voice = chosenVoice;
            }
            utterance.lang = chosenVoice?.lang || 'bn-BD';
            utterance.rate = selectedVoiceSpeed;

            if (selectedVoiceType === "female") {
                utterance.pitch = 1.16;
            } else if (selectedVoiceType === "male") {
                utterance.pitch = 0.84;
            } else {
                utterance.pitch = 1.0;
            }

            utterance.onend = () => {
                setTimeout(playNextChunk, 80);
            };
            utterance.onerror = () => {
                setTimeout(playNextChunk, 120);
            };

            try {
                window.speechSynthesis.speak(utterance);
            } catch (_) {
                playNextChunk();
            }
        };

        playNextChunk();
    }

    async function refreshChatModels() {
        try {
            const res = await fetch("https://api.groq.com/openai/v1/models", {
                headers: { "Authorization": `Bearer ${GROQ_API_KEY}` }
            });
            const data = await res.json();
            if (Array.isArray(data.data) && data.data.length > 0) {
                const chatIds = data.data
                    .map(m => m.id)
                    .filter(id => !isNonChatModel(id));

                const preferred = [
                    "llama-3.1-8b-instant",
                    "llama-3.3-70b-versatile",
                    "gemma2-9b-it"
                ];

                const ordered = [
                    ...preferred.filter(p => chatIds.includes(p)),
                    ...chatIds.filter(id => !preferred.includes(id))
                ];

                    candidateModels = ordered;

    function extractImagePrompt(text) {
        const clean = text.trim();
        const patterns = [
            /^(?:একটি\s+)?ছবি\s+(?:বানিয়ে|বানিয়ে|তৈরি করে|এঁকে)\s*(?:দাও|দে|দেন)?\s*[:\-]?\s*(.+)$/i,
            /^(?:একটি\s+)?পিক\s+(?:বানিয়ে|বানিয়ে|তৈরি করে|এঁকে)\s*(?:দাও|দে|দেন)?\s*[:\-]?\s*(.+)$/i,
            /^(?:draw|generate|create)\s+(?:an?\s+)?(?:image|picture|photo)\s+(?:of\s+)?(.+)$/i
        ];

        for (const pat of patterns) {
            const m = clean.match(pat);
            if (m && m[1] && m[1].trim().length > 1) {
                return m[1].trim();
            }
        }
        return null;
    }

    function generateArtworkFromPrompt(promptText) {
        const canvas = document.createElement("canvas");
        canvas.width = 768;
        canvas.height = 512;
        const ctx = canvas.getContext("2d");

        let hash = 2166136261;
        for (let i = 0; i < promptText.length; i++) {
            hash ^= promptText.charCodeAt(i);
            hash = Math.imul(hash, 16777619);
        }
        const rand = () => {
            hash ^= hash << 13;
            hash ^= hash >>> 17;
            hash ^= hash << 5;
            return ((hash >>> 0) % 10000) / 10000;
        };

        const palettes = [
            ["#0f172a", "#1e1b4b", "#38bdf8", "#f472b6"],
            ["#06281e", "#0f5132", "#20c997", "#ffd166"],
            ["#2b091c", "#590d22", "#ff4d6d", "#ffb703"],
            ["#0c1821", "#1b2a4a", "#00b4d8", "#90e0ef"]
        ];
        const pal = palettes[Math.abs(hash) % palettes.length];

        const bgGrad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        bgGrad.addColorStop(0, pal[0]);
        bgGrad.addColorStop(0.55, pal[1]);
        bgGrad.addColorStop(1, pal[0]);
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < 10; i++) {
            const cx = rand() * canvas.width;
            const cy = rand() * canvas.height;
            const rad = 60 + rand() * 190;
            const g = ctx.createRadialGradient(cx, cy, 4, cx, cy, rad);
            const col = pal[2 + (i % 2)];
            g.addColorStop(0, col + "66");
            g.addColorStop(1, "transparent");
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(cx, cy, rad, 0, Math.PI * 2);
            ctx.fill();
        }

        // জ্যামিতিক ও আর্টিস্টিক লেয়ার
        ctx.save();
        for (let i = 0; i < 14; i++) {
            const x = 60 + rand() * (canvas.width - 120);
            const y = 60 + rand() * (canvas.height - 120);
            const r = 18 + rand() * 75;
            ctx.strokeStyle = (i % 2 === 0 ? pal[2] : pal[3]) + "99";
            ctx.lineWidth = 2 + rand() * 3;
            ctx.beginPath();
            if (i % 3 === 0) {
                ctx.arc(x, y, r, 0, Math.PI * 2);
            } else if (i % 3 === 1) {
                ctx.moveTo(x, y - r);
                ctx.lineTo(x + r, y + r);
                ctx.lineTo(x - r, y + r);
                ctx.closePath();
            } else {
                ctx.roundRect(x - r / 2, y - r / 2, r, r * 0.7, 12);
            }
            ctx.stroke();
        }
        ctx.restore();

        // নিচে ক্যাপশন ব্যানার
        ctx.fillStyle = "rgba(10, 13, 22, 0.72)";
        ctx.fillRect(0, canvas.height - 84, canvas.width, 84);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 22px 'Segoe UI', Arial, sans-serif";
        ctx.textAlign = "center";
        const label = promptText.length > 52 ? promptText.slice(0, 52) + "..." : promptText;
        ctx.fillText(label, canvas.width / 2, canvas.height - 46);

        ctx.fillStyle = pal[2];
        ctx.font = "600 13px 'Segoe UI', Arial, sans-serif";
        ctx.fillText("Ridoy AI Studio • Text-to-Image", canvas.width / 2, canvas.height - 20);

        return canvas.toDataURL("image/jpeg", 0.92);
    }

    function buildRecentMessagesForContext() {
        const sess = chatSessions.find(s => s.id === currentSessionId);
        if (!sess || !Array.isArray(sess.messages)) return [];
        return sess.messages
            .slice(-6)
            .map(m => ({
                role: m.sender === "user" ? "user" : "assistant",
                content: String(m.text || "").slice(0, 800)
            }));
    }

    async function callGroqChat(modelName, systemPrompt, userText) {
        const historyContext = buildRecentMessagesForContext();
        const messagesPayload = [
            { role: "system", content: systemPrompt },
            ...historyContext,
            { role: "user", content: userText }
        ];

        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${GROQ_API_KEY}`
            },
            body: JSON.stringify({
                model: modelName,
                messages: messagesPayload,
                temperature: 0.7
            })
        });
        return await response.json();
    }

        if (!text) return;

        // লেখা দিয়ে ছবি বানানোর অনুরোধ হলে
        const imgPrompt = extractImagePrompt(text);
        if (imgPrompt) {

            appendMessage(caption, "ai", generatedUrl, `ridoy-ai-${Date.now()}.jpg`, true, true, Date.now());

            if (isFromLiveVoice && liveConversationActive) {
                setLiveBanner("🔊 Ridoy AI বলছে...");
                speakTextClear(`${imgPrompt} এর ছবি তৈরি করা হয়েছে। আর কী জানতে চান?`, () => {

                });

        }

        if (isCreatorQuestion(text)) {
            appendMessage(CREATOR_REPLY, "ai", null, null, true, true, Date.now());

                setLiveBanner("🔊 Ridoy AI বলছে...");

        if (isHomeAddressQuestion(text)) {

            if (isFromLiveVoice && liveConversationActive) {
                setLiveBanner("🔊 Ridoy AI বলছে...");

                });
            }
            return;
        }

        const memoryPart = savedMemories.length > 0
            ? `\nঅতিরিক্ত মেমোরি:\n- ${savedMemories.join("\n- ")}`
            : "";

        const systemPrompt = `তুমি Ridoy AI, একটি আধুনিক ও সহায়ক AI সহকারী। কেউ যদি জিজ্ঞাসা করে তোমাকে কে তৈরি করেছে বা কে বানিয়েছে, তাহলে উত্তর দেবে: "${CREATOR_REPLY}" কেউ যদি হৃদয় স্যারের বাসা বা ঠিকানা সম্পর্কে জিজ্ঞাসা করে, তাহলে উত্তর দেবে: "${HOME_ADDRESS_REPLY}" ${isFromLiveVoice ? "সরাসরি কথোপকথনের মতো স্বাভাবিক, পরিষ্কার ও সংক্ষিপ্তভাবে উত্তর দাও।" : "বাংলায় স্পষ্ট ও সুন্দরভাবে উত্তর দাও।"}${memoryPart}`;
        const statusEl = appendMessage("ভাবছি...", "status-msg", null, null, false, false, Date.now());
        if (isFromLiveVoice && liveConversationActive) {
            setLiveBanner("🤔 উত্তর তৈরি হচ্ছে...");
        }

        try {
            let data = null;

            for (let i = 0; i < candidateModels.length; i++) {
                const modelName = candidateModels[i];
                data = await callGroqChat(modelName, systemPrompt, text);

                if (!data.error) {
                    candidateModels.splice(i, 1);
                    candidateModels.unshift(modelName);
                    break;
                }

                const errMsg = data.error.message || "";
                const shouldTryNext =
                    /does not exist|do not have access|requires terms acceptance|decommissioned|not found/i.test(errMsg);

                if (!shouldTryNext) {
                    break;

                setLiveBanner("🔊 Ridoy AI পরিষ্কার ভয়েসে বলছে...");
                speakTextClear(reply, () => {
                    if (liveConversationActive) {
                        listenOnceInLiveMode();

            statusEl.remove();
            appendMessage(`❌ কানেকশন এরর: ${error.message}`, "error-msg", null, null, false, false, Date.now());
            if (isFromLiveVoice && liveConversationActive) listenOnceInLiveMode();
        }
    };

    function appendMessage(text, sender, imageDataUrl = null, downloadName = null, showSpeaker = false, shouldPersist = true, ts = Date.now(), fileInfo = null) {

            const fCard = document.createElement('div');
            fCard.className = 'file-card';
            fCard.innerHTML = `<div><strong>📄 ${escapeHtml(fileInfo.name)}</strong></div><div>${escapeHtml(fileInfo.sizeText)}</div>`;
            msgDiv.appendChild(fCard);
        }
        if (imageDataUrl) {
            const img = document.createElement('img');
            img.src = imageDataUrl;
            img.className = 'chat-img';
            msgDiv.appendChild(img);

            if (downloadName) {
                const dl = document.createElement('a');
                dl.href = imageDataUrl;
                dl.download = downloadName;
                dl.className = 'dl-link';
                dl.innerText = '⬇ ছবি ডাউনলোড করুন';
                msgDiv.appendChild(dl);
            }
        }

        if (sender === "user" || sender === "ai") {
            const meta = document.createElement('div');
            meta.className = 'msg-meta';
            meta.innerText = formatTimeNow(ts);
            msgDiv.appendChild(meta);
        }

        if ((showSpeaker || sender === "ai") && text) {
            const footer = document.createElement('div');
            footer.className = 'msg-footer';

            if (showSpeaker) {
                const spkBtn = document.createElement('button');
                spkBtn.type = 'button';
                spkBtn.className = 'speaker-btn';
                spkBtn.innerHTML = '🔊 শুনুন';
                spkBtn.onclick = () => window.toggleSpeakMessage(spkBtn, text);
                footer.appendChild(spkBtn);
            }

            const cpBtn = document.createElement('button');
            cpBtn.type = 'button';
            cpBtn.className = 'copy-btn';
            cpBtn.innerHTML = '📋 কপি';
            cpBtn.onclick = () => window.copyMessageText(cpBtn, text);
            footer.appendChild(cpBtn);

            msgDiv.appendChild(footer);
        }

        win.appendChild(msgDiv);
        win.scrollTop = win.scrollHeight;

        if (shouldPersist && (sender === "user" || sender === "ai") && text) {
            autoSaveMessageToSession(sender, text);
        }

        return msgDiv;
    }

    // বাম প্লাস (+) মেনু অ্যাকশনসমূহ
    window.chooseGalleryEdit = () => {
        closeAllOverlays();
        const inp = document.getElementById("imageEditInput");
        inp.value = "";
        inp.click();
    };

    window.chooseDirectPhoto = () => {
        closeAllOverlays();
        const inp = document.getElementById("directPhotoInput");
        inp.value = "";
        inp.click();
    };

    window.chooseDocumentFile = () => {
        closeAllOverlays();
        const inp = document.getElementById("docFileInput");
        inp.value = "";
        inp.click();
    };

    window.handleDirectPhotoSelect = (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            appendMessage(`ছবি পাঠানো হয়েছে: ${file.name}`, "user", e.target.result, null, false, true, Date.now());
        };
        reader.readAsDataURL(file);
    };

    window.handleDocumentFileSelect = async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;

        const kb = (file.size / 1024).toFixed(1);
        const sizeText = file.size > 1024 * 1024 ? `${(file.size / (1024 * 1024)).toFixed(2)} MB` : `${kb} KB`;

        let extractedText = "";
        const isReadableText = /\.(txt|csv|json|md|html|htm|js|css|xml|log|py|php)$/i.test(file.name) || /^text\//i.test(file.type);
        if (isReadableText && file.size < 250000) {
            try {
                extractedText = await file.text();
            } catch (_) {}
        }

        appendMessage(`ফাইল/ডকুমেন্ট পাঠানো হয়েছে: ${file.name}`, "user", null, null, false, true, Date.now(), {
            name: file.name,
            sizeText
        });

        if (extractedText.trim()) {
            const promptForAi = `ব্যবহারকারী "${file.name}" নামের একটি ডকুমেন্ট ফাইল পাঠিয়েছেন। এর সারসংক্ষেপ বা মূল বিষয় বাংলায় বুঝিয়ে বলো:\n\n${extractedText.slice(0, 4000)}`;
            await handleSend(promptForAi);
        }
    };

    let currentSelectedDataUrl = "";
    let modalRotationDeg = 0;
    let modalFlipX = 1;

    function updateModalPreviewTransform() {
        const imgEl = document.getElementById("selectedOriginalPreview");
        imgEl.style.transform = `rotate(${modalRotationDeg}deg) scaleX(${modalFlipX})`;
    }

    window.rotateModalImage = () => {
        modalRotationDeg = (modalRotationDeg + 90) % 360;
        updateModalPreviewTransform();
    };

    window.flipModalImage = () => {
        modalFlipX = modalFlipX * -1;
        updateModalPreviewTransform();
    };

    window.handleImageEditFileSelect = (event) => {
        const file = event.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            currentSelectedDataUrl = e.target.result;
            modalRotationDeg = 0;
            modalFlipX = 1;
            const imgEl = document.getElementById("selectedOriginalPreview");
            imgEl.src = currentSelectedDataUrl;
            updateModalPreviewTransform();
            document.getElementById("imgEditPrompt").value = "";
            document.getElementById("aiImageModal").classList.add("active");
        };
        reader.readAsDataURL(file);
    };

    window.closeAiImageModal = () => {
        document.getElementById("aiImageModal").classList.remove("active");
    };

    function buildSmartEditCanvas(imgEl, promptText, rotDeg, flipX) {
        const p = (promptText || "").toLowerCase();
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        const maxDim = 900;
        let w = imgEl.naturalWidth || imgEl.width;
        let h = imgEl.naturalHeight || imgEl.height;
        if (w > maxDim || h > maxDim) {
            const ratio = Math.min(maxDim / w, maxDim / h);
            w = Math.round(w * ratio);
            h = Math.round(h * ratio);
        }

        const swap = (rotDeg % 180) !== 0;
        canvas.width = swap ? h : w;
        canvas.height = swap ? w : h;

        let filterStr = "brightness(106%) contrast(112%) saturate(120%)";

        if (/black|white|b&w|bw|সাদা কালো|সাদাকালো|mono|grey|gray/.test(p)) {
            filterStr = "grayscale(100%) contrast(120%) brightness(104%)";
        } else if (/vintage|retro|old|ভিন্টেজ|পুরানো/.test(p)) {
            filterStr = "sepia(55%) contrast(110%) brightness(98%) saturate(85%)";
        } else if (/warm|golden|sunset|গরম|সোনালি/.test(p)) {
            filterStr = "sepia(28%) saturate(135%) contrast(110%) brightness(106%)";
        } else if (/cool|cyber|neon|night|নীল|নিয়ন|রাত/.test(p)) {
            filterStr = "hue-rotate(190deg) saturate(140%) contrast(118%) brightness(102%)";
        } else if (/bright|glow|light|উজ্জ্বল|আলো/.test(p)) {
            filterStr = "brightness(122%) contrast(108%) saturate(118%)";
        } else if (/soft|blur|dream|anime|cartoon|সফট|ব্লার|এনিমে|কার্টুন/.test(p)) {
            filterStr = "contrast(118%) saturate(145%) brightness(108%)";
        }

        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate((rotDeg * Math.PI) / 180);
        ctx.scale(flipX, 1);
        ctx.filter = filterStr;
        ctx.drawImage(imgEl, -w / 2, -h / 2, w, h);
        ctx.restore();

        return canvas.toDataURL("image/jpeg", 0.9);
    }

    window.processAiImageEdit = async () => {
        const promptText = document.getElementById("imgEditPrompt").value.trim() || "enhance photo quality naturally";
        const imgData = currentSelectedDataUrl;
        if (!imgData) return;

        const rotSnapshot = modalRotationDeg;
        const flipSnapshot = modalFlipX;

        closeAiImageModal();
        appendMessage(`নির্দেশনা: "${promptText}"`, "user", imgData, null, false, true, Date.now());
        const statusEl = appendMessage("ছবি এডিট করা হচ্ছে...", "status-msg", null, null, false, false, Date.now());

        try {
            const tempImg = new Image();
            tempImg.src = imgData;
            await new Promise((resolve, reject) => {
                tempImg.onload = resolve;
                tempImg.onerror = reject;
            });

            const editedUrl = buildSmartEditCanvas(tempImg, promptText, rotSnapshot, flipSnapshot);
            statusEl.remove();
            appendMessage(
                `আপনার নির্দেশনা ("${promptText}") অনুযায়ী ছবিটি এডিট করা হয়েছে:`,
                "ai",
                editedUrl,
                `ridoy-ai-edit-${Date.now()}.jpg`,
                true,
                true,
                Date.now()
            );
        } catch (err) {
            statusEl.remove();
            appendMessage(`❌ ছবি এডিট করতে সমস্যা হয়েছে: ${err.message}`, "error-msg", null, null, false, false, Date.now());
        }
    };

    // সরাসরি লাইভ ভয়েস কথোপকথন
    function setLiveBanner(msg) {
        const el = document.getElementById("liveVoiceStatusText");
        if (el) el.innerText = msg;
    }

    function listenOnceInLiveMode() {
        if (!liveConversationActive) return;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            appendMessage("⚠️ এই ব্রাউজারে লাইভ ভয়েস সাপোর্ট করে না। Google Chrome ব্যবহার করুন।", "error-msg", null, null, false, false, Date.now());
            stopLiveVoiceConversation();
            return;
        }

        if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
            appendMessage("⚠️ লাইভ মাইক্রোফোন ব্যবহারের জন্য পেজটি HTTPS লিংকে ওপেন করুন।", "error-msg", null, null, false, false, Date.now());
            stopLiveVoiceConversation();
            return;
        }

        try {
            if (liveRecognition) {
                liveRecognition.abort();
            }
        } catch (_) {}

        const recognition = new SpeechRecognition();
        liveRecognition = recognition;
        recognition.lang = 'bn-BD';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        const voiceBtn = document.getElementById('voiceBtn');
        voiceBtn.classList.add('listening');
        setLiveBanner("🎤 শুনছি... আপনার প্রশ্ন বলুন");

        let gotSpeech = false;

        recognition.onresult = (event) => {
            gotSpeech = true;
            const transcript = event.results?.[0]?.[0]?.transcript?.trim();
            if (transcript && liveConversationActive) {
                setLiveBanner(`🗣️ আপনি বলেছেন: "${transcript}"`);
                handleSend(transcript, { isFromLiveVoice: true });
            } else if (liveConversationActive) {
                listenOnceInLiveMode();
            }
        };

        recognition.onerror = (event) => {
            if (!liveConversationActive) return;
            if (event.error === "not-allowed") {
                appendMessage("❌ মাইক্রোফোন অনুমতি দেওয়া হয়নি। ব্রাউজার সেটিংস থেকে Microphone Allow করুন।", "error-msg", null, null, false, false, Date.now());
                stopLiveVoiceConversation();
                return;
            }
            if (event.error === "no-speech") {
                setLiveBanner("🎤 আবার বলুন, শুনছি...");
                setTimeout(() => {
                    if (liveConversationActive) listenOnceInLiveMode();
                }, 300);
                return;
            }
            setTimeout(() => {
                if (liveConversationActive) listenOnceInLiveMode();
            }, 550);
        };

        recognition.onend = () => {
            if (!liveConversationActive) {
                voiceBtn.classList.remove('listening');
                return;
            }
            if (!gotSpeech && !(window.speechSynthesis && window.speechSynthesis.speaking)) {
                setTimeout(() => {
                    if (liveConversationActive) listenOnceInLiveMode();
                }, 280);
            }
        };

        try {
            recognition.start();
        } catch (_) {
            setTimeout(() => {
                if (liveConversationActive) listenOnceInLiveMode();
            }, 500);
        }
    }

    window.toggleLiveVoiceConversation = () => {
        if (liveConversationActive) {
            stopLiveVoiceConversation();
        } else {
            liveConversationActive = true;
            document.getElementById("liveVoiceBar").classList.add("active");
            document.getElementById("voiceBtn").classList.add("listening");
            listenOnceInLiveMode();
        }
    };

    window.stopLiveVoiceConversation = () => {
        liveConversationActive = false;
        document.getElementById("liveVoiceBar").classList.remove("active");
        document.getElementById("voiceBtn").classList.remove("listening");
        try {
            if (liveRecognition) {
                liveRecognition.abort();
                liveRecognition = null;
            }
        } catch (_) {}
        stopSpeechNow();
    };
</script>
